  # Production: www.movenda.be + movenda.be. Tracks main; brief is where Julie reviews.
  # Created via the Render MCP. Redirects + headers below must be set in the Dashboard
  # (Settings > Redirects/Rewrites and Headers) — the MCP cannot set them.
  # Go-live day: PUBLIC_NOINDEX=false, then switch DNS. No X-Robots-Tag header here.
  - type: web
    name: movenda-www
    runtime: static
    branch: main
    buildCommand: cd web && npm install && npm run build
    staticPublishPath: web/dist
    autoDeploy: true
    domains:
      - www.movenda.be
      - movenda.be
    envVars:
      - key: PUBLIC_NOINDEX
        value: "true" # flip to "false" on go-live day, right before the DNS switch
      - key: PUBLIC_SITE_URL
        value: https://www.movenda.be
      - key: PUBLIC_THEME
        value: lab
      - key: PUBLIC_HOST_MODE
        value: full
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes: *oude-urls
