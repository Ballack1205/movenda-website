  # MPC-only host (this week). Same repo/Sanity as the QR preview.
  # PUBLIC_NOINDEX stays true until Friday 25 Sep 2026 + explicit OK. Do not flip in this file.
  - type: web
    name: movenda-mpc
    runtime: static
    buildCommand: cd web && npm install && npm run build
    staticPublishPath: web/dist
    autoDeploy: true
    envVars:
      - key: PUBLIC_NOINDEX
        value: "true"
      - key: PUBLIC_SITE_URL
        value: https://movenda-mpc.onrender.com
      - key: PUBLIC_THEME
        value: current
      - key: PUBLIC_HOST_MODE
        value: mpc
      - key: PUBLIC_MOVENDA_URL
        value: https://www.movenda.be
    headers:
      - path: /*
        name: X-Robots-Tag
        value: "noindex, nofollow"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
