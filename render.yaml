services:
  - type: web
    name: movenda-preview
    runtime: static
    buildCommand: cd web && npm install && npm run build
    staticPublishPath: web/dist
    autoDeploy: true
    envVars:
      - key: PUBLIC_NOINDEX
        value: "true" # flip to "false" only after Movenda confirms go-live on movenda.be
      - key: PUBLIC_SITE_URL
        value: https://movenda-preview.onrender.com
      - key: PUBLIC_THEME
        value: current
      - key: PUBLIC_HOST_MODE
        value: full
    headers:
      - path: /*
        name: X-Robots-Tag
        value: "noindex, nofollow"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    # 301 map: old movenda.be + mpc.movenda.be slugs → new IA.
