services:
  - type: web
    name: movenda-preview
    runtime: static
    buildCommand: cd web && npm install && npm run build
    staticPublishPath: web/dist
    autoDeploy: true
    envVars:
      - key: PUBLIC_NOINDEX
        value: "true" # flip to "false" only after Movenda confirms go-live on movenda.be
      - key: PUBLIC_SITE_URL
        value: https://movenda-preview.onrender.com
    headers:
      - path: /*
        name: X-Robots-Tag
        value: "noindex, nofollow"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    # 301 map: old movenda.be + mpc.movenda.be slugs → new IA.
    # This service was created via the Render MCP, not a Blueprint sync —
    # copy these rules into Dashboard > Settings > Redirects/Rewrites, or
    # run a Blueprint sync, before go-live. Blog slugs stayed identical.
    # Host-level mpc.movenda.be → /mpc/* is Fase 4 DNS (out of scope here).
    routes:
      - type: redirect
        source: /home
        destination: /
      - type: redirect
        source: /kine
        destination: /kinesitherapie
      - type: redirect
        source: /manuele
        destination: /kinesitherapie/manuele-therapie
      - type: redirect
        source: /oefentherapie
        destination: /kinesitherapie/oefentherapie
      - type: redirect
        source: /pre-en-post-natale
        destination: /kinesitherapie/pre-en-postnatale-kinesitherapie
      - type: redirect
        source: /lymfedrainage
        destination: /kinesitherapie/lymfedrainage
      - type: redirect
        source: /dryneedling
        destination: /kinesitherapie/dry-needling
      - type: redirect
        source: /acupunctuur
        destination: /kinesitherapie/acupunctuur
      - type: redirect
        source: /auriculotherapie
        destination: /kinesitherapie/auriculotherapie
      - type: redirect
        source: /cardiovasculaire
        destination: /kinesitherapie/cardiovasculaire-revalidatie
      - type: redirect
        source: /cupping
        destination: /kinesitherapie/cupping
      - type: redirect
