  # founder OK), create it, add SANITY_VIEWER_TOKEN, then set SANITY_STUDIO_LIVE_PREVIEW_URL
  # (e.g. https://movenda-live-preview.onrender.com) when deploying the Studio. See DECISIONS.md.
  # # Live preview for the Studio's "Live voorbeeld" tab (Sanity Presentation). Not public:
  # # noindex, no analytics, renders Sanity DRAFTS per request with the dev server, so edits show
  # # before Publiceren. Free plan: sleeps after 15 min, the first load then takes ~30 s.
  # # Same branch as the preview Julie reviews. The public static sites above are unaffected.
  # # Set SANITY_VIEWER_TOKEN in the Dashboard: Sanity → API → Tokens → add token with "Viewer" role.
